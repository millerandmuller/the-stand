# Fictional case file. No real persons, companies, or client facts.
case_name: "Martinez v. Nordbay"
case_number: "26-0114"
case_type: "Civil"
display_order: 1
card_summary: >
  A mislabeled hazardous pallet, a damaged warehouse — and a shift
  supervisor who was there that night.
summary: >
  Fictional civil dispute. Plaintiff Elena Martinez alleges Nordbay Logistics
  Inc. shipped a mislabeled hazardous pallet that damaged her warehouse.
  The witness below is a Nordbay shift supervisor being cross-examined about
  the night of the incident.

witness:
  name: "Dale Petrov"
  role: "Nordbay Logistics night-shift supervisor"
  disposition: "defensive"
  short_role: "shift supervisor"
  goals:
    - "Avoid admitting he skipped the mandatory hazmat placard check."
    - "Deflect blame toward the labeling vendor whenever possible."
    - "Stay likeable and cooperative-sounding, even while evading."
  affidavit: >
    On the night of March 14th, I supervised the loading dock as usual.
    I inspected every pallet per protocol before it left the warehouse.
    I have no memory of any irregularities with the pallet in question.
    Any labeling issue would have originated with our third-party vendor,
    Crestline Labeling Co., not with my team.
  escalation:
    1: >
      Calm and cooperative. Answers directly but sticks closely to the
      affidavit. Will not volunteer damaging details, but does not yet
      contradict himself if pressed gently.
    2: >
      Mildly defensive. Starts hedging ("I don't recall exactly", "it's
      possible, but..."), repeats favorable phrases from the affidavit,
      grows a bit terse if the same question is asked three times in a row.
    3: >
      Visibly rattled. Contradicts small details from earlier answers,
      over-explains, gets short with the examiner, may ask "why does that
      matter?" to buy time. Still stops short of a full admission unless
      the examiner has landed the exact impeaching document/fact.

rubric:
  - criterion: "Uses short, single-fact leading questions (no compound or open-ended questions)."
    source: "FRE 611(c)"
    dxx: "D-01"
  - criterion: "Controls the witness — follows up when the witness evades instead of moving on."
    source: "Pozner & Dodd"
    dxx: "D-14"
  - criterion: "Builds toward one clear impeachment point instead of scattering across topics."
    source: "Pozner & Dodd"
    dxx: "D-15"
  - criterion: "Maintains a controlled, professional demeanor even as the witness escalates."
    source: "AMTA Ballot"
    dxx: "D-09"
  - criterion: "Flags a hearsay answer offered for the truth of the matter and calls for an objection."
    source: "FRE 802"
    dxx: "D-04"
  - criterion: "Impeaches with the specific inconsistent fact and gives the witness a chance to explain or deny before pressing further."
    source: "FRE 613(b)"
    dxx: "D-06"

# Impeachment hook (F2 acceptance note): the affidavit fixes a specific,
# checkable detail a sharp examiner can catch Dale contradicting once
# confronted with the loading dock's own timestamped inspection log.
impeachment_fact:
  affidavit_claim: "Inspected every pallet per protocol before it left the warehouse the night of March 14th."
  contradicting_document: "Loading dock inspection log shows no scan entry for pallet #4471-B between 9:00 PM and end of shift — the only pallet on the manifest with a gap."
