<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowAudio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="#0b0c0e"/>
  <text x="30" y="38" fill="#e8e6e1" font-size="20" font-weight="600">The Stand — Architecture</text>
  <text x="30" y="58" fill="#8a8880" font-size="12">ADK 2.8.0 · Gemini Live (bidi) + gemini-3.7-flash · Cloud Run · Firestore</text>

  <!-- Browser -->
  <rect x="30" y="100" width="200" height="90" rx="8" fill="#131416" stroke="#333"/>
  <text x="130" y="135" fill="#e8e6e1" font-size="14" text-anchor="middle" font-weight="600">Browser UI</text>
  <text x="130" y="155" fill="#8a8880" font-size="11" text-anchor="middle">mic · waveform</text>
  <text x="130" y="170" fill="#8a8880" font-size="11" text-anchor="middle">rubric sidebar · debrief</text>

  <!-- FastAPI WS -->
  <rect x="330" y="100" width="220" height="90" rx="8" fill="#131416" stroke="#333"/>
  <text x="440" y="128" fill="#e8e6e1" font-size="14" text-anchor="middle" font-weight="600">server/app.py</text>
  <text x="440" y="146" fill="#8a8880" font-size="11" text-anchor="middle">FastAPI WebSocket /ws/{id}</text>
  <text x="440" y="162" fill="#8a8880" font-size="11" text-anchor="middle">Runner.run_live()</text>
  <text x="440" y="178" fill="#8a8880" font-size="11" text-anchor="middle">SessionOrchestrator</text>

  <line x1="230" y1="145" x2="330" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowAudio)"/>
  <text x="280" y="135" fill="#2563eb" font-size="10" text-anchor="middle">audio (pcm16)</text>

  <!-- WitnessAgent -->
  <rect x="640" y="80" width="240" height="100" rx="8" fill="#131416" stroke="#2563eb" stroke-width="1.5"/>
  <text x="760" y="108" fill="#e8e6e1" font-size="14" text-anchor="middle" font-weight="600">WitnessAgent</text>
  <text x="760" y="126" fill="#9db4c0" font-size="11" text-anchor="middle">gemini-3.1-flash-live-preview</text>
  <text x="760" y="142" fill="#8a8880" font-size="11" text-anchor="middle">Live / bidi · barge-in</text>
  <text x="760" y="158" fill="#8a8880" font-size="11" text-anchor="middle">escalation via pressure_level</text>
  <text x="760" y="172" fill="#8a8880" font-size="11" text-anchor="middle">guard_character callback (F4)</text>

  <line x1="550" y1="130" x2="640" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowAudio)"/>

  <!-- RubricScorer -->
  <rect x="640" y="230" width="240" height="90" rx="8" fill="#131416" stroke="#4a9d6e" stroke-width="1.5"/>
  <text x="760" y="258" fill="#e8e6e1" font-size="14" text-anchor="middle" font-weight="600">RubricScorer</text>
  <text x="760" y="276" fill="#9db4c0" font-size="11" text-anchor="middle">gemini-3.7-flash</text>
  <text x="760" y="292" fill="#8a8880" font-size="11" text-anchor="middle">per-exchange, fire-and-forget</text>
  <text x="760" y="306" fill="#8a8880" font-size="11" text-anchor="middle">cites [D-xx] · never invents</text>

  <line x1="440" y1="190" x2="440" y2="275" stroke="#4a9d6e" stroke-width="2"/>
  <line x1="440" y1="275" x2="640" y2="275" stroke="#4a9d6e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="265" fill="#4a9d6e" font-size="10" text-anchor="middle">examiner Q + witness A (text)</text>

  <!-- DebriefAgent -->
  <rect x="640" y="360" width="240" height="90" rx="8" fill="#131416" stroke="#b0954a" stroke-width="1.5"/>
  <text x="760" y="388" fill="#e8e6e1" font-size="14" text-anchor="middle" font-weight="600">DebriefAgent</text>
  <text x="760" y="406" fill="#9db4c0" font-size="11" text-anchor="middle">gemini-3.7-flash</text>
  <text x="760" y="422" fill="#8a8880" font-size="11" text-anchor="middle">session close: AMTA score,</text>
  <text x="760" y="436" fill="#8a8880" font-size="11" text-anchor="middle">2 moments, practice focus</text>

  <line x1="440" y1="190" x2="440" y2="405" stroke="#b0954a" stroke-width="2"/>
  <line x1="440" y1="405" x2="640" y2="405" stroke="#b0954a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="395" fill="#b0954a" font-size="10" text-anchor="middle">full transcript + scored events</text>

  <!-- Firestore -->
  <rect x="330" y="480" width="220" height="80" rx="8" fill="#131416" stroke="#333"/>
  <text x="440" y="508" fill="#e8e6e1" font-size="14" text-anchor="middle" font-weight="600">Firestore</text>
  <text x="440" y="526" fill="#8a8880" font-size="11" text-anchor="middle">session store</text>
  <text x="440" y="542" fill="#8a8880" font-size="11" text-anchor="middle">transcript · score events · debrief</text>

  <line x1="440" y1="190" x2="440" y2="480" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="500" fill="#6b7280" font-size="10" text-anchor="middle" transform="rotate(90 490 500)"></text>

  <!-- Case files -->
  <rect x="30" y="480" width="200" height="80" rx="8" fill="#131416" stroke="#333"/>
  <text x="130" y="508" fill="#e8e6e1" font-size="14" text-anchor="middle" font-weight="600">case_files/*.yaml</text>
  <text x="130" y="526" fill="#8a8880" font-size="11" text-anchor="middle">witness persona · affidavit</text>
  <text x="130" y="542" fill="#8a8880" font-size="11" text-anchor="middle">rubric [D-xx]</text>

  <line x1="230" y1="520" x2="330" y2="520" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cloud Run -->
  <rect x="930" y="480" width="220" height="80" rx="8" fill="#131416" stroke="#333"/>
  <text x="1040" y="508" fill="#e8e6e1" font-size="14" text-anchor="middle" font-weight="600">Cloud Run</text>
  <text x="1040" y="526" fill="#8a8880" font-size="11" text-anchor="middle">timeout 3600s · ≥1GiB</text>
  <text x="1040" y="542" fill="#8a8880" font-size="11" text-anchor="middle">deploy target for server/app.py</text>

  <line x1="550" y1="145" x2="1040" y2="145" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="1040" y1="145" x2="1040" y2="480" stroke="#333" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="1090" y="310" fill="#6b7280" font-size="10" text-anchor="middle" transform="rotate(90 1090 310)">deployed as</text>

  <!-- legend -->
  <text x="30" y="600" fill="#8a8880" font-size="10">— blue: bidi audio · green: per-exchange rubric text · amber: session-close debrief text · gray: persistence/deploy</text>
</svg>
